name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Seed baseline data
        env:
          DATABASE_URL: sqlite:///./data/ci_seed.db
        run: |
          python - <<'PY'
          from src.database import get_session_factory
          from src.preprocess import seed_baseline_from_tsv
          with get_session_factory()() as session:
              n = seed_baseline_from_tsv("data/life_cycle.tsv", session)
          assert n > 1000, n
          print(f"seeded {n} records")
          PY

      - name: Test
        run: pytest -q
